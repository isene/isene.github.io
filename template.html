<script>
(function () {
  var b = document.getElementById('theme-toggle'); if (!b) return;
  var root = document.documentElement;
  function current() {
    var t = root.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function giscus(t) {
    var f = document.querySelector('iframe.giscus-frame'); if (!f) return;
    f.contentWindow.postMessage({ giscus: { setConfig: { theme: t } } }, 'https://giscus.app');
  }
  b.addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    giscus(next);
  });
})();
(function () {
  var hs = document.querySelectorAll('.entry-content h2[id], .entry-content h3[id]');
  for (var i = 0; i < hs.length; i++) {
    var a = document.createElement('a'); a.className = 'anchor'; a.href = '#' + hs[i].id; a.textContent = '#'; a.setAttribute('aria-label', 'Link to this section');
    hs[i].appendChild(a);
  }
})();
(function () {
  var box = document.querySelector('.find'); if (!box) return;
  var q = document.getElementById('find'), out = document.getElementById('hits'), items, at = 0;
  box.hidden = false;
  function show() {
    var words = q.value.toLowerCase().match(/\S+/g) || [], hits = [];
    var res = words.map(function (w) { return new RegExp('(^|[^a-z0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')); });
    for (var i = 0; items && words.length && i < items.length && hits.length < 10; i++) {
      if (res.every(function (r) { return r.test(items[i][3]); })) hits.push(items[i]);
    }
    out.textContent = ''; at = 0;
    if (items && words.length && !hits.length) hits.push(['Nothing found', '', '']);
    hits.forEach(function (h, n) {
      var li = document.createElement('li'), a = document.createElement('a'), s = document.createElement('span');
      if (h[1]) a.href = h[1];
      a.textContent = h[0]; s.textContent = h[2]; a.appendChild(s); li.appendChild(a);
      if (!n) li.className = 'at';
      out.appendChild(li);
    });
  }
  q.addEventListener('focus', function () {
    if (items) return;
    items = [];
    fetch('/find.json').then(function (r) { return r.json(); }).then(function (d) {
      for (var i = 0; i < d.length; i++) d[i][3] = (d[i][0] + ' ' + d[i][2]).toLowerCase();
      items = d; show();
    });
  });
  q.addEventListener('input', show);
  q.addEventListener('keydown', function (e) {
    var li = out.children, step = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    if (step && li.length) {
      e.preventDefault();
      li[at].className = ''; at = (at + step + li.length) % li.length; li[at].className = 'at';
    } else if (e.key === 'Enter' && li.length && li[at].firstChild.href) {
      location.href = li[at].firstChild.href;
    } else if (e.key === 'Escape') {
      q.value = ''; show(); q.blur();
    }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target.tagName;
    if (e.key !== '/' || e.ctrlKey || e.altKey || e.metaKey || t === 'INPUT' || t === 'TEXTAREA' || e.target.isContentEditable) return;
    e.preventDefault(); q.focus();
  });
})();
</script>
</body>
