<meta charset="utf-8">
<script>
(function () {
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
})();
</script>

<script>if(navigator.doNotTrack!=="1")new Image().src="https://isene.com/cgi-bin/px.rb?p="+encodeURIComponent(location.pathname)+"&r="+encodeURIComponent(document.referrer);</script>
</footer>
<script>
(function () {
  var b = document.getElementById('theme-toggle'); if (!b) return;
  var root = document.documentElement;
  function current() {
    var t = root.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function giscus(t) {
    var f = document.querySelector('iframe.giscus-frame'); if (!f) return;
    f.contentWindow.postMessage({ giscus: { setConfig: { theme: t } } }, 'https://giscus.app');
  }
  b.addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    giscus(next);
  });
})();
(function () {
  var hs = document.querySelectorAll('.entry-content h2[id], .entry-content h3[id]');
  for (var i = 0; i < hs.length; i++) {
    var a = document.createElement('a'); a.className = 'anchor'; a.href = '#' + hs[i].id; a.textContent = '#'; a.setAttribute('aria-label', 'Link to this section');
    hs[i].appendChild(a);
  }
})();
</script>
</body>
