<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa5b8"/>
    </marker>
  </defs>
  <rect width="880" height="560" rx="14" fill="#0f1420"/>

  <!-- Laptop -->
  <rect x="20" y="20" width="560" height="520" rx="12" fill="#161c2b" stroke="#3a4560"/>
  <text x="40" y="52" fill="#e0e6f0" font-size="18" font-weight="bold">Laptop</text>
  <text x="40" y="86" fill="#9aa5b8" font-size="13">Claude Code sessions, a dozen at a time</text>
  <g font-size="15" fill="#c9a6f5" text-anchor="middle">
    <rect x="40" y="100" width="88" height="44" rx="6" fill="#1e2638" stroke="#7c6cf0"/><text x="84" y="127">fe2o3</text>
    <rect x="145" y="100" width="88" height="44" rx="6" fill="#1e2638" stroke="#7c6cf0"/><text x="189" y="127">ci</text>
    <rect x="250" y="100" width="88" height="44" rx="6" fill="#1e2638" stroke="#7c6cf0"/><text x="294" y="127">pa</text>
    <rect x="355" y="100" width="88" height="44" rx="6" fill="#1e2638" stroke="#7c6cf0"/><text x="399" y="127">system</text>
    <rect x="460" y="100" width="88" height="44" rx="6" fill="#1e2638" stroke="#7c6cf0" stroke-dasharray="4 3"/><text x="504" y="127">+8</text>
  </g>
  <g stroke="#9aa5b8" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="84" y1="147" x2="84" y2="182"/>
    <line x1="189" y1="147" x2="189" y2="182"/>
    <line x1="294" y1="147" x2="294" y2="182"/>
    <line x1="399" y1="147" x2="399" y2="182"/>
    <line x1="504" y1="147" x2="504" y2="182"/>
  </g>
  <rect x="40" y="185" width="508" height="50" rx="8" fill="#2a2140" stroke="#b58cf0"/>
  <text x="56" y="206" fill="#e0e6f0" font-size="14" font-weight="bold">Message bus: one file per message</text>
  <text x="56" y="225" fill="#9aa5b8" font-size="12">a hook hands it over on the session's next turn</text>

  <g stroke="#9aa5b8" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="190" y1="238" x2="190" y2="272"/>
    <line x1="464" y1="238" x2="464" y2="272"/>
    <line x1="343" y1="330" x2="377" y2="330"/>
  </g>
  <text x="200" y="260" fill="#9aa5b8" font-size="12">reads, wakes</text>
  <text x="474" y="260" fill="#9aa5b8" font-size="12">hooks write</text>

  <rect x="40" y="275" width="300" height="110" rx="8" fill="#1e2638" stroke="#e5a03c"/>
  <text x="56" y="300" fill="#e5a03c" font-size="15" font-weight="bold">fleet, in a terminal</text>
  <g fill="#e0e6f0" font-size="13">
    <text x="56" y="322">who works, who waits for you</text>
    <text x="56" y="340">the ETA each one gave</text>
    <text x="56" y="358">open questions, numbered</text>
    <text x="56" y="376">wakes a session with its mail</text>
  </g>

  <rect x="380" y="275" width="168" height="110" rx="8" fill="#1e2638" stroke="#3ddc84"/>
  <text x="394" y="300" fill="#3ddc84" font-size="14" font-weight="bold">Relay folder</text>
  <g fill="#e0e6f0" font-size="12">
    <text x="394" y="321">finished turns,</text>
    <text x="394" y="339">answers, the</text>
    <text x="394" y="357">session list,</text>
    <text x="394" y="375">phone messages</text>
  </g>

  <rect x="40" y="410" width="508" height="116" rx="8" fill="#1e2638" stroke="#5a6a8a"/>
  <text x="56" y="436" fill="#e0e6f0" font-size="15" font-weight="bold">Rules in every session</text>
  <g fill="#e0e6f0" font-size="13">
    <text x="56" y="458">the verdict in the first sentence</text>
    <text x="56" y="477">ETA as a clock time, never a length</text>
    <text x="56" y="496">questions numbered, answered by number</text>
    <text x="56" y="515">hooks send back an answer that breaks them</text>
  </g>

  <!-- Server -->
  <line x1="551" y1="330" x2="617" y2="330" stroke="#9aa5b8" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="584" y="318" fill="#9aa5b8" font-size="11" text-anchor="middle">Syncthing</text>
  <rect x="620" y="270" width="100" height="120" rx="8" fill="#1e2638" stroke="#2f9fd8"/>
  <text x="630" y="294" fill="#2f9fd8" font-size="13" font-weight="bold">Small</text>
  <text x="630" y="311" fill="#2f9fd8" font-size="13" font-weight="bold">server</text>
  <g fill="#e0e6f0" font-size="12">
    <text x="630" y="334">passes the</text>
    <text x="630" y="351">files to and</text>
    <text x="630" y="368">from the</text>
    <text x="630" y="385">phone</text>
  </g>

  <!-- Phone -->
  <line x1="723" y1="330" x2="757" y2="330" stroke="#9aa5b8" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="740" y="318" fill="#9aa5b8" font-size="11" text-anchor="middle">HTTPS</text>
  <rect x="760" y="180" width="100" height="300" rx="18" fill="#1e2638" stroke="#3ddc84"/>
  <rect x="795" y="190" width="30" height="5" rx="2.5" fill="#3a4560"/>
  <text x="772" y="222" fill="#3ddc84" font-size="15" font-weight="bold">Phone</text>
  <g fill="#e0e6f0" font-size="12">
    <text x="772" y="246">fleet app</text>
    <text x="772" y="276">buzzes when</text>
    <text x="772" y="293">a turn ends</text>
    <text x="772" y="323">shows each</text>
    <text x="772" y="340">answer</text>
    <text x="772" y="370">Yes, No,</text>
    <text x="772" y="387">Done, Rec</text>
    <text x="772" y="417">words to</text>
    <text x="772" y="434">any session</text>
  </g>
</svg>
